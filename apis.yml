description: BioLite is a New York City‑based startup that creates off‑grid energy products for outdoor recreation and emerging markets. Founded
  in 2006, it designs wood‑burning stoves that generate electricity via thermoelectric technology, along with solar lighting, portable power stations,
  and rechargeable lanterns. The company’s mission is to bring clean, reliable energy to people everywhere, supporting sustainable living and
  empowering communities.

